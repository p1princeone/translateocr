name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inject Gemini API Key
        run: |
          # Automatically replaces the placeholder with your secure GitHub secret during build
          find . -name "TranslateAccessibilityService.kt" -exec sed -i 's/"YOUR_API_KEY_HERE"/"${{ secrets.GEMINI_API_KEY }}"/g' {} +

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
