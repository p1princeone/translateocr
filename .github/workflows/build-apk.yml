name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inject Gemini API Key Safely
        run: |
          file=$(find . -name "TranslateAccessibilityService.kt" | head -n 1)
          if [ -n "$file" ]; then
            sed -i 's/"YOUR_API_KEY_HERE"/"${{ secrets.GEMINI_API_KEY }}"/g' "$file"
            echo "API key successfully injected into $file"
          else
            echo "Error: TranslateAccessibilityService.kt not found!"
            exit 1
          fi

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
